<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>RICO BOT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffc832;--purple:#8b5cf6;--bg:#0a0612;--card:#150e26;--card2:#1d1433;--text:#f4f0ff;--muted:#9b90bd;--border:rgba(255,255,255,.12);--green:#22c55e;--red:#fb7185}
[hidden]{display:none!important}
body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(600px 400px at 85% -5%,rgba(139,92,246,.35),transparent),radial-gradient(500px 400px at 0% 100%,rgba(255,200,50,.18),transparent),var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
button,input,select{font-family:inherit}

/* شاشة الترحيب */
.welcome{text-align:center;width:100%;max-width:380px}
.logo{width:96px;height:96px;margin:0 auto 22px;border-radius:28px;background:linear-gradient(135deg,var(--gold),var(--purple));display:grid;place-items:center;font:900 52px Arial,sans-serif;color:#fff;box-shadow:0 0 40px rgba(139,92,246,.6)}
.welcome h1{font-size:28px;font-weight:900;line-height:1.5}
.welcome h1 span,.title{background:linear-gradient(90deg,var(--gold),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);margin:10px 0 28px;font-size:15px;line-height:1.8}

.btn{border:0;cursor:pointer;border-radius:16px;font-weight:900;font-size:17px;padding:15px 20px;color:#17081f;background:linear-gradient(90deg,var(--gold),var(--purple));box-shadow:0 10px 30px rgba(139,92,246,.35);transition:transform .15s;width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);box-shadow:none}

/* النوافذ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0;backdrop-filter:blur(4px)}
.sheet{background:var(--card);border:1px solid var(--border);border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:460px;max-height:90vh;overflow:auto;position:relative}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:26px}}
.sheet h2{font-size:22px;font-weight:900;margin-bottom:6px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.7}
.close{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:18px;cursor:pointer}

input{width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--border);background:var(--card2);color:var(--text);font-size:20px;direction:ltr;text-align:center;letter-spacing:1px;outline:none}
input:focus{border-color:var(--gold)}
.country{height:24px;color:var(--gold);font-weight:700;text-align:center;margin:8px 0 14px;font-size:15px}
.msg{min-height:22px;text-align:center;margin-top:12px;font-size:14px;color:var(--muted);line-height:1.7}
.msg.ok{color:var(--green);font-weight:700}
.msg.err{color:var(--red);font-weight:700}

/* الكود والعداد */
.ring{position:relative;width:150px;height:150px;margin:8px auto 12px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:900 40px Arial,sans-serif}
.code{direction:ltr;text-align:center;font:900 32px Arial,sans-serif;letter-spacing:6px;padding:16px;border-radius:16px;background:var(--card2);border:2px solid var(--gold);color:var(--gold);margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* لوحة المطور */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.stat strong{color:var(--gold);font-size:22px;font-weight:900}
.list{max-height:240px;overflow:auto;margin-top:10px}
.item{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--border);direction:ltr;font-size:14px}
.item em{font-style:normal;color:var(--muted)}
.item .bn{color:var(--red)}

/* زر الأغاني العائم */
.fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--purple));font-size:24px;box-shadow:0 8px 24px rgba(139,92,246,.5);z-index:20}
.fab.playing{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(139,92,246,.5)}50%{box-shadow:0 0 0 10px rgba(139,92,246,0)}}
.song{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;margin-top:8px;border-radius:14px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:16px;cursor:pointer;font-weight:700}
.song.on{border-color:var(--gold);color:var(--gold)}
.now{text-align:center;color:var(--muted);font-size:14px;margin-top:12px;min-height:20px}
</style>
</head>
<body>

<!-- شاشة الترحيب -->
<main class="welcome">
  <div class="logo">R</div>
  <h1>مرحبا بك في <span>RICO BOT</span></h1>
  <p>منصتك لتنصيب وتشغيل بوت واتساب بسهولة</p>
  <button class="btn" id="openInstall">تنصيب</button>
  <button class="btn ghost" id="openDev" style="margin-top:12px">لوحة المطور</button>
</main>

<!-- نافذة التنصيب -->
<div class="modal" id="installModal" hidden>
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h2>تنصيب البوت</h2>
    <p class="sub">ادخل رقمك مع مفتاح الدولة</p>

    <input type="tel" id="phone" placeholder="249×××××××" autocomplete="tel" inputmode="numeric">
    <div class="country" id="country"></div>
    <button class="btn" id="pairBtn">تنصيب الرقم</button>

    <div id="codeBox" hidden>
      <div class="ring">
        <svg width="150" height="150"><circle cx="75" cy="75" r="66" fill="none" stroke="var(--card2)" stroke-width="10"/><circle id="arc" cx="75" cy="75" r="66" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="0"/></svg>
        <b id="secs">60</b>
      </div>
      <div class="code" id="code"></div>
      <div class="row2">
        <button class="btn" id="copyBtn">نسخ الكود</button>
        <button class="btn ghost" id="newCodeBtn">طلب كود جديد</button>
      </div>
    </div>

    <div class="msg" id="msg" role="status"></div>
  </div>
</div>

<!-- نافذة لوحة المطور -->
<div class="modal" id="devModal" hidden>
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h2 class="title">لوحة المطور</h2>

    <div id="devLogin">
      <p class="sub">ادخل كود التفعيل</p>
      <input type="password" id="devPass" placeholder="كود التفعيل" style="font-size:16px;letter-spacing:0">
      <div style="height:12px"></div>
      <button class="btn" id="devLoginBtn">دخول</button>
    </div>

    <div id="devDash" hidden>
      <div class="stats">
        <div class="stat"><small>المستخدمون</small><strong id="sUsers">0</strong></div>
        <div class="stat"><small>متصل الآن</small><strong id="sOn">0</strong></div>
        <div class="stat"><small>الاتصالات</small><strong id="sConn">0</strong></div>
        <div class="stat"><small>الفاشلة</small><strong id="sFail">0</strong></div>
      </div>
      <div class="sub" style="margin:0">الحد الحالي: <b id="sLimit" style="color:var(--gold)">0</b></div>
      <div class="list" id="numList"></div>
      <div style="height:12px"></div>
      <button class="btn ghost" id="devRefresh">تحديث</button>
    </div>

    <div class="msg" id="devMsg" role="status"></div>
  </div>
</div>

<!-- زر الأغاني -->
<button class="fab" id="musicBtn" aria-label="الأغاني">🎵</button>

<div class="modal" id="musicModal" hidden>
  <div class="sheet">
    <button class="close" data-close>✕</button>
    <h2>الأغاني</h2>
    <p class="sub">اختار أغنية. الأغنية 7 بتشتغل أول ما تدخل المنصة.</p>
    <div id="songs"></div>
    <div class="now" id="now"></div>
  </div>
</div>

<audio id="player" preload="none"></audio>

<script>
const $ = id => document.getElementById(id);

/* ===== أدوات ===== */
const PREFIXES = {
  "249":"السودان","20":"مصر","966":"السعودية","971":"الإمارات","964":"العراق","962":"الأردن",
  "965":"الكويت","974":"قطر","973":"البحرين","968":"عُمان","967":"اليمن","961":"لبنان","963":"سوريا",
  "212":"المغرب","213":"الجزائر","216":"تونس","218":"ليبيا","222":"موريتانيا","252":"الصومال",
  "253":"جيبوتي","269":"جزر القمر","970":"فلسطين"
};

async function api(url, body) {
  const res = await fetch(url, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
    credentials: "same-origin"
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) {
    const e = new Error(data.message || "صار خطأ في السيرفر");
    e.status = res.status;
    throw e;
  }
  return data;
}

function openModal(id) { $(id).hidden = false; }
function closeModal(id) { $(id).hidden = true; }
document.querySelectorAll("[data-close]").forEach(b =>
  b.addEventListener("click", () => b.closest(".modal").hidden = true)
);
document.querySelectorAll(".modal").forEach(m =>
  m.addEventListener("click", e => { if (e.target === m) m.hidden = true; })
);

/* ===== التنصيب ===== */
let timer = null, poll = null;

function digits(v) { return String(v || "").replace(/\D/g, ""); }

function countryName(v) {
  for (const len of [3, 2, 1]) {
    const name = PREFIXES[v.slice(0, len)];
    if (name) return name;
  }
  return "";
}

$("phone").addEventListener("input", e => {
  const v = digits(e.target.value);
  e.target.value = v;
  $("country").textContent = countryName(v);
});

function setMsg(text, type = "") {
  $("msg").textContent = text;
  $("msg").className = "msg " + type;
}

function startTimer(seconds) {
  clearInterval(timer);
  const arc = $("arc"), L = 414.7;
  let s = seconds;
  const tick = () => {
    $("secs").textContent = s;
    arc.style.strokeDashoffset = L * (1 - s / seconds);
  };
  tick();
  timer = setInterval(() => {
    s--;
    if (s <= 0) {
      clearInterval(timer);
      $("secs").textContent = "0";
      setMsg("انتهى الكود. اضغط طلب كود جديد", "err");
      return;
    }
    tick();
  }, 1000);
}

function watch(phone) {
  clearInterval(poll);
  let tries = 0;
  poll = setInterval(async () => {
    if (++tries > 60) return clearInterval(poll);
    try {
      const s = await api("/api/pair/status?phone=" + phone);
      if (s.status === "connected") {
        clearInterval(poll);
        clearInterval(timer);
        setMsg("تم ربط البوت بنجاح ✓", "ok");
      }
    } catch {}
  }, 3000);
}

async function requestCode() {
  const phone = digits($("phone").value);
  if (phone.length < 8 || phone.length > 15) {
    return setMsg("ادخل الرقم كامل مع مفتاح الدولة", "err");
  }
  $("pairBtn").disabled = true;
  $("newCodeBtn").disabled = true;
  setMsg("جاري طلب الكود…");

  try {
    const d = await api("/api/pair", { phone });
    $("code").textContent = d.code;
    $("codeBox").hidden = false;
    setMsg("ادخل الكود في واتساب من الأجهزة المرتبطة", "ok");
    startTimer(d.expiresIn || 60);
    watch(phone);
  } catch (e) {
    setMsg(e.message, "err");
  } finally {
    $("pairBtn").disabled = false;
    $("newCodeBtn").disabled = false;
  }
}

$("openInstall").addEventListener("click", () => openModal("installModal"));
$("pairBtn").addEventListener("click", requestCode);
$("newCodeBtn").addEventListener("click", requestCode);
$("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("code").textContent);
    setMsg("اتنسخ الكود ✓", "ok");
  } catch {
    setMsg("انسخ الكود يدوياً: " + $("code").textContent);
  }
});

/* ===== لوحة المطور ===== */
$("openDev").addEventListener("click", () => {
  openModal("devModal");
  loadDev();
});

async function loadDev() {
  try {
    const s = await api("/api/developer/stats");
    $("devLogin").hidden = true;
    $("devDash").hidden = false;
    $("sUsers").textContent = s.users;
    $("sOn").textContent = s.connected;
    $("sConn").textContent = s.connections;
    $("sFail").textContent = s.failed;
    $("sLimit").textContent = s.limit;

    const nums = await api("/api/developer/numbers");
    $("numList").innerHTML = nums.length
      ? nums.map(n => `<div class="item"><span>${n.number}${n.banned ? ' <b class="bn">محظور</b>' : ""}</span><em>${n.status}</em></div>`).join("")
      : '<p class="sub" style="text-align:center">ما في أرقام منصبة لسه</p>';
  } catch (e) {
    if (e.status === 401) {
      $("devLogin").hidden = false;
      $("devDash").hidden = true;
    } else {
      $("devMsg").textContent = e.message;
    }
  }
}

$("devLoginBtn").addEventListener("click", async () => {
  try {
    await api("/api/developer/login", { password: $("devPass").value });
    $("devPass").value = "";
    $("devMsg").textContent = "";
    loadDev();
  } catch (e) {
    $("devMsg").textContent = e.message;
  }
});
$("devRefresh").addEventListener("click", loadDev);

/* ===== الأغاني ===== */
const SONGS = [1, 2, 3, 4, 5, 6, 7].map(n => ({ id: n, title: "الأغنية " + n, file: `songs/${n}.mp3` }));
const player = $("player");
let current = null;

function playSong(id) {
  const s = SONGS.find(x => x.id === id);
  if (!s) return;
  current = id;
  player.src = s.file;
  player.play().then(() => {
    $("musicBtn").classList.add("playing");
    $("now").textContent = "تشغيل: " + s.title;
  }).catch(() => {
    $("now").textContent = "ما قدرت أشغل " + s.title + "، تأكد من ملف الأغنية";
  });
  document.querySelectorAll(".song").forEach(b => b.classList.toggle("on", Number(b.dataset.id) === id));
}

function renderSongs() {
  $("songs").innerHTML = SONGS.map(s =>
    `<button class="song" data-id="${s.id}"><span>${s.title}</span><span>▶</span></button>`
  ).join("");
  document.querySelectorAll(".song").forEach(b =>
    b.addEventListener("click", () => playSong(Number(b.dataset.id)))
  );
}

player.addEventListener("pause", () => $("musicBtn").classList.remove("playing"));
player.addEventListener("play", () => $("musicBtn").classList.add("playing"));

$("musicBtn").addEventListener("click", () => {
  renderSongs();
  openModal("musicModal");
});

// المتصفحات بتمنع التشغيل التلقائي، فالأغنية 7 بتبدأ أول ضغطة في الصفحة
document.addEventListener("click", () => {
  if (current === null) playSong(7);
}, { once: true });
</script>

</body>
      </html>
