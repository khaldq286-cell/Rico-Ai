
.avatar-circle {
  width: 200px;
  height: 200px;
  margin: 20px auto;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  border: 4px solid #ffd447;
  box-shadow: 0 0 25px #761cff, 0 0 35px #087bff;
}

.avatar-circle img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center;
}

.avatar-glow {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: inset 0 0 25px #ffd447;
  pointer-events: none;
}
