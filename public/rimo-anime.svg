
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --purple: #761cff;
  --blue: #087bff;
  --gold: #ffd447;
  --dark: #080719;
  --white: #ffffff;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: var(--white);
  background: var(--dark);
  overflow-x: hidden;
}

.background-effects {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  background: linear-gradient(
    125deg,
    #080719,
    #21105a,
    #071c45,
    #32105b,
    #080719
  );
  background-size: 400% 400%;
  animation: backgroundMove 15s ease infinite;
}

@keyframes backgroundMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .5;
}

.glow-one {
  background: #761cff;
  top: 5%;
  right: -100px;
}

.glow-two {
  background: #087bff;
  bottom: 5%;
  left: -100px;
}

.glow-three {
  background: #ffd447;
  top: 45%;
  left: 40%;
  opacity: .12;
}

.electric-lines {
  position: absolute;
  inset: 0;
  opacity: .18;
  background: repeating-linear-gradient(
    115deg,
    transparent 0px,
    transparent 90px,
    #ffd447 92px,
    transparent 94px
  );
  animation: electricMove 8s linear infinite;
}

@keyframes electricMove {
  from { transform: translateX(-100px); }
  to { transform: translateX(100px); }
}

.topbar {
  width: 100%;
  min-height: 75px;
  padding: 15px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(5, 5, 20, .7);
  border-bottom: 1px solid rgba(255, 212, 71, .3);
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 23px;
  font-weight: bold;
  color: var(--gold);
}

.brand img {
  width: 42px;
  height: 42px;
  object-fit: contain;
}

.channel-link {
  text-decoration: none;
  color: white;
  background: #128c50;
  padding: 11px 18px;
  border-radius: 25px;
  font-size: 13px;
}

.container {
  width: min(100% - 30px, 650px);
  margin: auto;
  padding: 35px 0;
}

.hero {
  text-align: center;
  margin-bottom: 35px;
}

/* دائرة الشخصية */
.avatar-circle {
  width: 200px;
  height: 200px;
  margin: 10px auto 25px;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #24105e, #087bff);
  border: 4px solid var(--gold);
  box-shadow:
    0 0 15px #087bff,
    0 0 30px #761cff,
    0 0 45px rgba(255, 212, 71, .5);
  animation: avatarGlow 3s ease-in-out infinite alternate;
}

@keyframes avatarGlow {
  from {
    box-shadow: 0 0 15px #087bff, 0 0 25px #761cff;
  }
  to {
    box-shadow: 0 0 25px #ffd447, 0 0 45px #087bff;
  }
}

.avatar-circle img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
  position: relative;
  z-index: 2;
}

.avatar-glow {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: inset 0 0 25px rgba(255, 212, 71, .7);
  pointer-events: none;
  z-index: 3;
}

.hero h1 {
  font-size: 27px;
  margin-bottom: 12px;
}

.hero h1 span {
  color: var(--gold);
  text-shadow: 0 0 15px #ffd447;
}

.subtitle {
  color: #c5c3e8;
  font-size: 14px;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  padding: 9px 18px;
  background: rgba(255,255,255,.08);
  border-radius: 30px;
  font-size: 12px;
}

.status-dot {
  width: 9px;
  height: 9px;
  background: #25e879;
  border-radius: 50%;
  box-shadow: 0 0 10px #25e879;
}

.panel {
  background: rgba(12, 12, 35, .85);
  border: 1px solid rgba(255, 212, 71, .25);
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow: 0 10px 35px rgba(0,0,0,.3);
  backdrop-filter: blur(15px);
}

.panel h2 {
  color: var(--gold);
  margin-bottom: 12px;
  font-size: 21px;
}

.description {
  color: #b8b7d5;
  font-size: 13px;
  margin-bottom: 22px;
  line-height: 1.8;
}

form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 18px;
}

label {
  font-size: 13px;
  color: #e2dcff;
}

input,
select,
textarea {
  width: 100%;
  padding: 14px;
  color: white;
  background: #17152f;
  border: 1px solid #48406d;
  border-radius: 10px;
  outline: none;
  font-size: 14px;
}

select option {
  background: #17152f;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 10px rgba(255,212,71,.2);
}

button {
  padding: 14px;
  border: none;
  border-radius: 10px;
  color: #171020;
  background: linear-gradient(100deg, #ffd447, #ffae27);
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 18px rgba(255,212,71,.4);
}

#result {
  display: none;
  text-align: center;
  padding: 20px;
  background: rgba(118,28,255,.15);
  border: 1px solid #761cff;
  border-radius: 15px;
}

#result h3 {
  color: var(--gold);
  margin-bottom: 15px;
}

#pairCode {
  display: block;
  color: var(--gold);
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 5px;
  margin-bottom: 15px;
}

#result p {
  color: #c7c5e6;
  font-size: 12px;
  margin-top: 12px;
}

#message {
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
  color: var(--gold);
}

.developer-panel {
  border-color: rgba(118,28,255,.5);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 20px 0;
}

.stat-card {
  padding: 18px 10px;
  text-align: center;
  background: rgba(118,28,255,.15);
  border: 1px solid rgba(118,28,255,.4);
  border-radius: 12px;
}

.stat-card span {
  display: block;
  font-size: 12px;
  color: #c8c4e7;
  margin-bottom: 10px;
}

.stat-card strong {
  color: var(--gold);
  font-size: 23px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #9995bd;
  font-size: 12px;
}

[hidden] {
  display: none !important;
}

@media (max-width: 480px) {
  .avatar-circle {
    width: 175px;
    height: 175px;
  }

  .hero h1 {
    font-size: 22px;
  }

  .panel {
    padding: 18px;
  }

  .brand {
    font-size: 19px;
  }
}
