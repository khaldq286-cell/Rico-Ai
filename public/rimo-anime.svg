.avatar-circle {
  width: 220px;
  height: 220px;
  margin: 25px auto;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  border: 3px solid #00ff88;
  background: #050b08;
  box-shadow:
    0 0 15px #00ff88,
    0 0 35px #00ff8866,
    0 0 65px #00ff8844;
  animation: avatarPulse 3s ease-in-out infinite;
}

.avatar-circle img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
}

.avatar-glow {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow:
    inset 0 0 20px #00ff88,
    inset 0 0 40px #00ff8844;
  pointer-events: none;
}

@keyframes avatarPulse {
  0%, 100% {
    box-shadow: 0 0 15px #00ff88, 0 0 35px #00ff8866;
  }
  50% {
    box-shadow: 0 0 25px #00ff88, 0 0 55px #00ff88aa;
  }
}
